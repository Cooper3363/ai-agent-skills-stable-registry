id: structured_metric_summary
name_zh: 单项指标摘要
version: 0.1.0
business_package: 经营报表分析包
status: platform_deliverable
status_label: 可交付平台
source_projects:
  - name: Instructor
    repo: https://github.com/567-labs/instructor
    license: MIT
license:
  commercial_use_status: allowed_after_review
  risk_level: medium
l2_status: simulated_l2_passed
platform_acceptance: passed
adapter_targets:
  - openclow
  - openclaw
  - hermes
  - mcp
  - generic_agent
runtime:
  model_provider: platform_controlled
  api_key_required: platform_model_key_if_llm_backed
  external_service_required: false
intent: 对单项经营指标生成结构化摘要、异常说明和行动建议。
inputs:
  - {name: metric_name, type: string, required: true}
  - {name: current_value, type: number, required: true}
  - {name: comparison_value, type: number, required: false}
  - {name: metric_definition, type: string, required: false}
  - {name: threshold_rules, type: object, required: false}
  - {name: business_context, type: object, required: false}
outputs:
  - {name: metric_summary, type: string}
  - {name: change_description, type: string}
  - {name: anomaly_flag, type: boolean}
  - {name: anomaly_reasoning, type: string}
  - {name: possible_factors, type: array}
  - {name: recommended_actions, type: array}
  - {name: data_quality_notes, type: array}
  - {name: human_review_required, type: boolean}
permissions:
  network: none
  read_business_metrics: required
  write_actions: none
human_review_triggers:
  - financial_decision
  - tax_related
  - credit_related
  - cashflow_critical
  - unclear_metric_definition
  - severe_missing_data
next_action: 接入前确认与完整日报周报 Skill 的边界。
