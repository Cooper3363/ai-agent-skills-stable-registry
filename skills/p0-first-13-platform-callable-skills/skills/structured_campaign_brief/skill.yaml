id: structured_campaign_brief
name_zh: 活动 Brief 结构化
version: 0.1.0
business_package: 营销内容生产包
status: platform_deliverable
status_label: 可交付平台
source_projects:
  - name: Instructor
    repo: https://github.com/567-labs/instructor
    license: MIT
license:
  commercial_use_status: allowed_after_review
  risk_level: low
l2_status: simulated_l2_passed
platform_acceptance: passed
adapter_targets:
  - openclow
  - openclaw
  - hermes
  - mcp
  - generic_agent
runtime:
  model_provider: platform_controlled
  api_key_required: platform_model_key_if_llm_backed
  external_service_required: false
intent: 将活动需求结构化为 brief、素材需求和投放变量 JSON。
inputs:
  - {name: raw_brief, type: string, required: true}
  - {name: business_context, type: object, required: false}
  - {name: channel, type: string, required: false}
  - {name: campaign_goal, type: string, required: false}
  - {name: constraints, type: object, required: false}
outputs:
  - {name: campaign_summary, type: string}
  - {name: target_audience, type: string}
  - {name: key_messages, type: array}
  - {name: creative_requirements, type: array}
  - {name: placement_variables, type: object}
  - {name: missing_fields, type: array}
  - {name: human_review_required, type: boolean}
permissions:
  network: none
  read_business_context: optional
  write_actions: none
human_review_triggers:
  - price_unclear
  - inventory_unclear
  - regulated_industry
  - budget_sensitive
  - conflicting_rules
next_action: 接入前确认渠道变量结构。
