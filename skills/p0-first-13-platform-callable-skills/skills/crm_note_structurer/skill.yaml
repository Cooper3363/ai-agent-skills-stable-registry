id: crm_note_structurer
name_zh: CRM 记录结构化
version: 0.1.0
business_package: 销售跟进助手包
status: platform_deliverable
status_label: 可交付平台
source_projects:
  - name: Instructor
    repo: https://github.com/567-labs/instructor
    license: MIT
license:
  commercial_use_status: allowed_after_review
  risk_level: medium
l2_status: simulated_l2_passed
platform_acceptance: passed
adapter_targets:
  - openclow
  - openclaw
  - hermes
  - mcp
  - generic_agent
runtime:
  model_provider: platform_controlled
  api_key_required: platform_model_key_if_llm_backed
  external_service_required: false
intent: 将销售跟进记录结构化为摘要、线索分层和下一步动作建议。
inputs:
  - {name: raw_note, type: string, required: true}
  - {name: customer_profile, type: object, required: false}
  - {name: deal_context, type: object, required: false}
  - {name: lead_scoring_rules, type: object, required: false}
outputs:
  - {name: summary, type: string}
  - {name: customer_needs, type: array}
  - {name: objections, type: array}
  - {name: lead_stage, type: string}
  - {name: lead_score, type: string}
  - {name: next_actions, type: array}
  - {name: missing_info, type: array}
  - {name: human_review_required, type: boolean}
permissions:
  network: none
  read_crm_note: required
  read_customer_profile: optional
  write_actions: none
human_review_triggers:
  - discount
  - contract_terms
  - complaint
  - personal_information
  - payment_commitment
  - explicit_rejection
  - low_confidence
next_action: 接入前确认销售阶段枚举和写回策略。
