id: faq_answer_with_citations
name_zh: 带引用 FAQ 问答
version: 0.1.0
business_package: 客服知识库助手包
status: platform_deliverable
status_label: 可交付平台
source_projects:
  - name: Haystack
    repo: https://github.com/deepset-ai/haystack
    license: Apache-2.0
license:
  commercial_use_status: allowed_after_review
  risk_level: medium
l2_status: simulated_l2_special_retest_passed
platform_acceptance: passed
adapter_targets:
  - openclow
  - openclaw
  - hermes
  - mcp
  - generic_agent
runtime:
  model_provider: platform_controlled
  api_key_required: platform_model_key_if_llm_backed
  external_service_required: false
network_scope:
  mode: controlled_platform_services_only
  allowed: platform_controlled_knowledge_base_and_model_calls
  forbidden: arbitrary_external_upload_or_unapproved_web_access
intent: 根据企业知识库回答客户问题并附带可追溯引用。
inputs:
  - {name: question, type: string, required: true}
  - {name: knowledge_base_refs, type: array, required: true}
  - {name: customer_context, type: object, required: false}
  - {name: language, type: string, required: false}
  - {name: min_confidence, type: number, required: false}
outputs:
  - {name: answer, type: string}
  - {name: citations, type: array}
  - {name: confidence, type: number}
  - {name: handoff_required, type: boolean}
  - {name: handoff_reason, type: string}
  - {name: risk_flags, type: array}
permissions:
  network: controlled_platform_services_only
  read_knowledge_base: required
  customer_data: optional
  write_actions: none
  external_upload: forbidden
human_review_triggers:
  - low_confidence
  - no_citation
  - conflicting_sources
  - complaint
  - refund
  - account_recovery
  - privacy_sensitive
next_action: 接入前确认 citation 与真实知识库命中一致。
